<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="750x745" href="/assets/brand/logo-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16x16.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="manifest" href="/assets/brand/site.webmanifest">
<meta name="theme-color" content="#FAF6F3">
<title>My Journey · Yoga to Transform</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{font-size:17px;color-scheme:light;--bg:#FAF6F3;--card:#fff;--ink:#2A1F1D;--muted:#6B5558;--forest:#12452F;--cocoa:#6B3B35;--rose:#DDB8BC;--blush:#EDE0E0;--accent:#A64F5C;--line:#E8DCD9;--on-forest:#fff;
--serif:'EB Garamond',Georgia,serif;--sans:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans)}
.app{max-width:560px;margin:0 auto;padding:0 18px 48px}
h1,h2,h3{font-family:var(--serif);color:var(--cocoa);font-weight:600;margin:0 0 .4em;line-height:1.2}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}p{margin:0 0 .9em}
.sub{color:var(--muted);font-size:1rem}
header{padding:22px 0 8px}
.brand-lockup{display:flex;align-items:center;gap:10px;margin:8px 0 4px}.brand-icon{width:42px;height:42px;object-fit:contain}.brand-wordmark{display:block;width:min(170px,50vw);max-height:78px;height:auto;object-fit:contain;object-position:left center}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;padding:10px 0;z-index:5;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:1;min-width:max-content;font:700 1rem var(--sans);padding:10px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
nav button[aria-selected=true]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.tick{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.tick:first-of-type{border-top:0}
.tick input{width:24px;height:24px;accent-color:var(--forest);flex:none}
.tick.done span{color:var(--muted);text-decoration:line-through}
.btn{font:700 1rem var(--sans);padding:12px 22px;border-radius:999px;border:2px solid var(--forest);background:var(--forest);color:var(--on-forest);cursor:pointer;margin:4px 8px 4px 0}
.btn.o{background:transparent;color:var(--forest)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button{font:700 1rem var(--sans);padding:8px 14px;border-radius:999px;border:1.5px solid var(--forest);background:transparent;color:var(--forest);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--forest);color:var(--on-forest)}
input[type=text],input[type=date]{width:100%;font:1rem var(--sans);padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 12px}
.msg{background:var(--blush);border-radius:14px;padding:14px 16px;margin:12px 0;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:14px 0}
.dot{aspect-ratio:1;border-radius:50%;background:var(--blush)}
.dot.d{background:var(--forest)}.dot.t{outline:2px solid var(--accent);outline-offset:1px}
.feel button{font-size:1.5rem;background:transparent;border:2px solid transparent;border-radius:12px;padding:4px 8px;cursor:pointer}
.feel button[aria-pressed=true]{border-color:var(--accent);background:var(--blush)}
.big{font-family:var(--serif);font-size:2.6rem;color:var(--cocoa);line-height:1}
.ring{display:block;margin:0 auto;max-width:240px;width:100%}
.out{border-left:4px solid var(--rose);padding:6px 14px;margin:8px 0;font-family:var(--serif);font-size:1.2rem}
.hide{display:none}
.vid{aspect-ratio:16/9;border-radius:14px;background:var(--blush);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;border:2px dashed var(--rose);color:var(--ink)}
.vid .pl{width:56px;height:56px;border-radius:50%;background:var(--forest);color:var(--on-forest);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:8px}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:700;color:var(--cocoa)}details p{margin:8px 0 0}
a.btn{display:inline-block;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.chip{font:700 1rem var(--sans);padding:8px 14px;border-radius:999px;border:1.5px solid var(--forest);background:transparent;color:var(--forest);cursor:pointer;margin:3px 4px 3px 0}
.chip[aria-pressed=true]{background:var(--forest);color:var(--on-forest)}
.chip.x{border-style:dashed}
.log{padding:10px 0;border-top:1px solid var(--line);font-size:1rem}.add{display:flex;gap:8px}.add input{margin:6px 0}
</style>
</head>
<body>
<div class="app">
<header><div style="text-align:right"><a href="/">Back to my overview</a></div><div class="brand-lockup"><img class="brand-icon" src="/assets/brand/logo-small-icon.png" alt=""><img class="brand-wordmark" src="/assets/brand/logo-text-only.png" alt="Yoga to Transform"></div><h1>My Journey</h1><p class="sub">A space to notice patterns and keep what you learn. There is no deadline, and nothing resets if you miss a day.</p></header>
<nav role="tablist" id="tabs"></nav>
<main id="main"></main>
</div>
<script>
var KEY='y2t-journey-v1',PROFILE_KEY='y2t-profile-id',TABS=[['today','Today'],['move','Move'],['timer','Meal window'],['menu','Pause & Choose'],['playbook','Playbook'],['journey','Journey']],tab=(function(){var t=new URL(location.href).searchParams.get('tab');return TABS.some(function(x){return x[0]===t})?t:'today'})();
var legacyMigrationAllowed=false,profileId=resolveProfileId(),CACHE={},syncReady=false,_syncTimer=null;
function resolveProfileId(){
 var valid=/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
 var url=new URL(location.href),id=url.searchParams.get('journey'),stored='';
 try{stored=localStorage.getItem(PROFILE_KEY)||''}catch(e){}
 var supplied=valid.test(id||'');legacyMigrationAllowed=!supplied||id===stored;
 if(!supplied)id=stored;
 if(!valid.test(id||''))id=crypto.randomUUID();
 try{localStorage.setItem(PROFILE_KEY,id)}catch(e){}
 if(url.searchParams.get('journey')!==id){url.searchParams.set('journey',id);history.replaceState(null,'',url.pathname+url.search+url.hash)}
 return id;
}
var ITEMS=['move my body in a way I enjoy','drink water through the day','fill my plate with real food I enjoy','eat sitting down, from a plate, slowly','read or breathe for ten quiet minutes','wind down for a good night\u2019s sleep'];
var FEEL=['\uD83D\uDE1E','\uD83D\uDE15','\uD83D\uDE42','\uD83D\uDE0A','\uD83E\uDD29'];
var S={start:null,mode:'get',days:{},fast:{start:null,hrs:12},reframes:[],menu:null,pulls:[],pat:{t:[],h:'',m:[]},worked:[],sessionLearnings:[],buddy:null,custom:[]};

var CATS=[['starters','Starters','Quick, a few minutes'],['mains','Mains','An hour or so'],['sides','Sides','Alongside the boring jobs'],['desserts','Desserts','Once in a while. Notice how you feel afterwards'],['specials','Specials','When they\u2019re available to you']];
var DEF={starters:['Dance to a favourite song','Have a snack','One minute of star jumps','Hug a pet'],mains:['Bake','Paint','Journal','Go for a walk','Do a jigsaw puzzle','Plan a trip'],sides:['Music while I tidy','Listen to a podcast','Light a candle','Audiobook'],desserts:['Scroll social media','Watch TV'],specials:['Book a holiday','Go to a concert','Massage or nails']};
var FEELINGS=['Tired','Stressed','Bored','Lonely','Sad','Anxious','Frustrated','Celebrating','Not sure'];
if(!S.pat)S.pat={t:[],h:'',m:[]};
var CH=['go for a 30-minute walk','do 10 minutes of strength with weights or my body','move for 10 minutes inside','swap one sugary drink for water','drink two litres of water','eat breakfast sitting down, without a screen','eat from a side plate and chew slowly','keep to a 12-hour meal window (see the timer)','add protein and veg to a meal so I feel full','plan a treat to look forward to','put a healthy meal in the freezer for later','read ten pages of a book','stretch and breathe for five minutes','wind down 30 minutes before bed','walk with a friend'];
var PT=[['fast','I eat too fast'],['bored','I snack when bored'],['skip','I skip meals, then overeat'],['tired','I eat for comfort when tired or stressed'],['evening','I graze in the evening'],['sweet','I have a sweet tooth']];
var SUG={fast:[6],bored:[9,11,12],skip:[5,8],tired:[13,12],evening:[8,9],sweet:[3,9]};
var HT=['Morning','Afternoon','Evening','Late night'],MV=['Walking','Dancing','Yoga','Strength','Swimming','Cycling'];
var PE=false,PB=-1,PICK=[],PICKER_OPEN=false,MW={w:'out',e:'mid'};
var PLAN={out:{low:'A ten-minute stroll round the block. Going counts.',mid:'An easy 20-minute walk. Pick a route you love.',full:'A brisk 30 to 45 minute walk. Add hills, or a backpack with a little weight.'},in:{low:'Five minutes of gentle stretching and slow breathing, or dance to one favourite song.',mid:'Ten minutes: 2 rounds of 10 squats, 10 wall push-ups and 30 seconds of marching on the spot.',full:'Twenty minutes: 3 rounds of 10 squats, 10 wall push-ups, 10 glute bridges and a 20-second plank. Rest when you need to.'}};
var GD=['Choose tomorrow\u2019s 3 challenges','Pack my gym bag','Put my shoes by the front door','Set an alarm for tomorrow','Pack my lunch for tomorrow','Lay out my yoga gear','Put overnight oats or chia in the fridge','Fill a water bottle'],GE=false;
if(!S.gifts)S.gifts=GD.slice();
if(!S.menu)S.menu=JSON.parse(JSON.stringify(DEF));
var PF='',NOTE='',EDIT=false,MSG='';
function scheduleSync(){
 clearTimeout(_syncTimer);
 _syncTimer=setTimeout(async function(){
  try{await fetch('/api/state?journey='+encodeURIComponent(profileId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(CACHE)})}catch(e){}
 },600);
}
function save(){if(!syncReady)return;CACHE.y2t=S;scheduleSync()}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function niceDate(k){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(k||'')))return'';return new Date(k+'T00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})}
function today(){return ds(new Date())}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function day(k){return S.days[k]||(S.days[k]={c:[],f:0})}
function challengeSessions(d){var out=(d&&Array.isArray(d.sessions)?d.sessions:[]).slice();if(d&&d.p&&d.p.length)out.push({p:d.p,c:d.c||[],ac:d.ac||{},mode:d.mode||S.mode});return out}
function counted(k){var d=S.days[k];return challengeSessions(d).some(function(s){return s.p&&s.p.length&&(s.c||[]).length>=2})}
function pre(){return S.mode==='get'?'I get to ':'I want to '}
function render(){
 var t=document.getElementById('tabs');
 t.innerHTML=TABS.map(function(x){return '<button role="tab" data-t="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+'</button>'}).join('');
 t.querySelectorAll('button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
 var m=document.getElementById('main');
 m.innerHTML=({today:vToday,timer:vTimer,menu:vMenu,move:vMove,playbook:vPlaybook,journey:vJourney})[tab]();
 bind();
}
function glowViews(){
 var by={},days=[],h='',all=0;
 for(var i=13;i>=0;i--){var dd=new Date();dd.setDate(dd.getDate()-i);var d=S.days[ds(dd)],ratings=[];
  challengeSessions(d).forEach(function(session){Object.keys(session.ac||{}).forEach(function(j){var r=session.ac[j];if(r&&session.c&&session.c.indexOf(+j)>-1){ratings.push(r);var t=session.p[+j];if(t)(by[t]=by[t]||[]).push(r);all++}})});
  days.push(ratings.length?ratings.reduce(function(a,b){return a+b},0)/ratings.length:0)}
 if(days.filter(Boolean).length>=3){
  h+='<h3 style="margin-top:16px">Afterglow notes, last 14 days</h3><svg viewBox="0 0 140 44" width="100%" role="img" aria-label="Optional afterglow ratings over the last 14 days">';
  days.forEach(function(v,i){h+='<rect x="'+(i*10)+'" y="'+(40-(v?v/5*36:2))+'" width="8" height="'+(v?v/5*36:2)+'" rx="2" fill="'+(v?'var(--forest)':'var(--blush)')+'"/>'});
  h+='</svg><p class="sub">A personal note to help you notice what fits you.</p>';
 }
 var top=Object.keys(by).map(function(t){return[t,by[t].reduce(function(a,b){return a+b},0)/by[t].length,by[t].length]}).filter(function(x){return x[2]>=2}).sort(function(a,b){return b[1]-a[1]}).slice(0,3);
 if(all>=3&&top.length){h+='<h3 style="margin-top:12px">Challenges I have rated highly</h3>';top.forEach(function(x){h+='<div class="out">'+esc(x[0])+' <span class="sub">'+x[1].toFixed(1)+' out of 5</span></div>'})}
 return h;
}
function welcome(){
 var last=null;
 Object.keys(S.days).forEach(function(k){var d=S.days[k];if(challengeSessions(d).some(function(s){return s.c&&s.c.length})&&(!last||k>last))last=k});
 if(!last)return'';
 var gap=Math.round((new Date(today()+'T00:00')-new Date(last+'T00:00'))/864e5);
 if(gap<3)return'';
 var h='<div class="card"><h3>Welcome back</h3><p>There is nothing to catch up on. Come back whenever it suits you. '+(S.worked.length?'Here\u2019s what worked for you before:':'')+'</p>';
 S.worked.slice(0,3).forEach(function(x){h+='<div class="out">'+esc(x)+'</div>'});
 return h+'<button class="btn o" data-go="playbook">Open my Playbook</button></div>';
}
function yest(){var d=new Date();d.setDate(d.getDate()-1);return ds(d)}
function thanks(){var y=S.days[yest()];if(!y||!y.g||!y.g.length)return'';
 return '<div class="card"><h3>Thanks, past you</h3><p class="sub">Last night you left yourself a few gifts:</p>'+y.g.map(function(x){return '<div class="out">'+esc(x)+'</div>'}).join('')+'</div>'}
function giftCard(){
 if(new Date().getHours()<16)return'';
 var d=day(today());d.g=d.g||[];
 var h='<div class="card"><h3>Leave a gift for tomorrow</h3><p class="sub">Small things tonight make tomorrow easier. These are optional and don\u2019t count toward your 3.</p>';
 if(GE){S.gifts.forEach(function(x,i){h+='<button class="chip x" data-gx="'+i+'">'+esc(x)+' \u00D7</button>'});
  h+='<div class="add"><input type="text" id="ga" maxlength="60" placeholder="Add my own gift" aria-label="Add my own gift"><button class="chip" id="gab">Add</button></div>'}
 else S.gifts.forEach(function(x,i){var on=d.g.indexOf(x)>-1;h+='<label class="tick'+(on?' done':'')+'"><input type="checkbox" data-gi="'+i+'"'+(on?' checked':'')+'><span>'+esc(x)+'</span></label>'});
 if(!GE&&d.g.length)h+='<div class="msg">Lovely. Tomorrow-you says thanks.</div>';
 return h+'<button class="chip x" id="gedit">'+(GE?'Done editing':'Edit my gifts')+'</button></div>';
}
function suggested(){var o=[];S.pat.t.forEach(function(t){(SUG[t]||[]).forEach(function(i){if(o.indexOf(i)<0)o.push(i)})});return o}
function vToday(){
 var k=today(),d=day(k),h='';
 h+='<div class="card"><h2>You are fine as you are</h2><p class="sub">There is nothing you need to do today. No judgement. If you want to explore something, you can choose three challenges for today and see what you learn about yourself.</p>';
 if(!d.p||!d.p.length){
  if(!PICKER_OPEN)h+='<button class="btn" id="challenge-open">I want to challenge myself</button>';
  else{
   h+='<h3>Choose three challenges for today</h3><div class="seg"><button data-m="get" aria-pressed="'+(S.mode==='get')+'">I get to</button> <button data-m="want" aria-pressed="'+(S.mode==='want')+'">I want to</button></div><p class="sub" style="margin-top:10px">Choose the ones that feel useful or interesting. You can change your choices before saving, or leave this for another day.</p><div class="row"><button class="chip" id="roll">Roll the dice</button><button class="chip x" id="challenge-cancel">Not today</button></div><div>';
   var sg=suggested(),all=CH.concat(S.custom);
   all.forEach(function(c,i){h+='<button class="chip" data-p="'+i+'" aria-pressed="'+(PICK.indexOf(c)>-1)+'">'+(sg.indexOf(i)>-1?'★ ':'')+esc(pre()+c)+'</button>'});
   h+='</div><div class="add"><input type="text" id="cu" maxlength="60" placeholder="Add my own challenge" aria-label="Add my own challenge"><button class="chip" id="cub">Add</button></div><div class="sub">'+PICK.length+' of 3 chosen. Tap a chosen challenge to remove it, then choose a replacement.</div><button class="btn" id="st"'+(PICK.length===3?'':' disabled style="opacity:.45"')+'>Save my three choices</button>';
  }
 }else{
  h+='<h3>My choices for today</h3>';
  d.p.forEach(function(it,i){var on=d.c.indexOf(i)>-1;h+='<label class="tick'+(on?' done':'')+'"><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+'><span>'+pre()+esc(it)+'</span></label>';
   if(on){var ac=(d.ac||{})[i];h+='<div style="padding-left:36px"><div class="sub">How did that feel?</div><div class="feel">'+FEEL.map(function(f,r){return '<button data-ac="'+i+'-'+(r+1)+'" aria-pressed="'+(ac===r+1)+'" aria-label="Afterglow '+(r+1)+' of 5">'+f+'</button>'}).join('')+'</div>';
    if(PB===i)h+='<div class="msg">That felt good. Add it to your Playbook so you remember?<br><button class="chip" data-pbadd="'+i+'">Add to my Playbook</button><button class="chip x" data-pbx="1">Not now</button></div>';
    h+='</div>'}});
  var c=d.c.length;
  h+='<div class="msg">'+(c>=2?'You tried at least two of your three chosen challenges. That counts as a challenge day. Anything else is optional.':c===1?'You tried one challenge. Two of your three is enough for a counted challenge day. Anything else is optional.':'Start with whichever feels useful, or leave it here.')+'</div><button class="chip x" id="ch">Change today\u2019s choices</button>';
 }
 h+='</div>'+welcome();
 if(S.buddy)h+='<div class="card"><h3>Walk with '+esc(S.buddy.n||'my buddy')+'</h3><p>'+esc(S.buddy.w)+'</p>'+(S.buddy.solo?'<p class="sub">If they can\u2019t make it, I\u2019m going anyway.</p>':'')+'</div>';
 h+='<details class="card"><summary>Would it help to check in with myself?</summary><p class="sub">You can note how you feel, or skip this completely.</p><div class="feel">'+FEEL.map(function(f,i){return '<button data-f="'+(i+1)+'" aria-pressed="'+(d.f===i+1)+'" aria-label="Feeling '+(i+1)+' of 5">'+f+'</button>'}).join('')+'</div></details>';
 h+='<div class="card"><h3>Feeling a pull toward food?</h3><p class="sub">Pause for a moment. You can notice what is going on without judgement.</p><button class="btn o" data-go="menu">Open Pause &amp; Choose</button></div>';
 return h;
}
function vMove(){
 var h='<div class="card"><h2>Move my way</h2><p class="sub">'+(S.pat.m.length?'You enjoy '+S.pat.m.join(', ').toLowerCase()+'. ':'')+'Pick where you are and how much energy you\u2019ve got. There\u2019s always a version that counts.</p><h3>Where?</h3><div class="seg row"><button data-w="out" aria-pressed="'+(MW.w==='out')+'">Outside</button><button data-w="in" aria-pressed="'+(MW.w==='in')+'">Inside (rain or no time)</button></div><h3 style="margin-top:14px">Energy?</h3><div class="seg row"><button data-e="low" aria-pressed="'+(MW.e==='low')+'">Low</button><button data-e="mid" aria-pressed="'+(MW.e==='mid')+'">Okay</button><button data-e="full" aria-pressed="'+(MW.e==='full')+'">Full</button></div><div class="msg">'+PLAN[MW.w][MW.e]+'</div><p class="sub">Discomfort is okay. Pain is information. Stop if something is sharp or you feel dizzy.</p></div>';
 var b=S.buddy||{n:'',w:'',solo:true};
 h+='<div class="card"><h2>Walking buddy</h2><p class="sub">Plans with another person are easier to keep. Decide now what happens if they cancel.</p><label class="sub" for="bn">Who?</label><input type="text" id="bn" maxlength="40" value="'+esc(b.n)+'" placeholder="A friend, Mum, a neighbour"><label class="sub" for="bw">When and where?</label><input type="text" id="bw" maxlength="80" value="'+esc(b.w)+'" placeholder="Saturday 8am, lake loop"><label class="tick"><input type="checkbox" id="bs"'+(b.solo?' checked':'')+'><span>If they can\u2019t make it, I\u2019ll go anyway</span></label><button class="btn" id="bsv">Save plan</button><button class="btn o" id="bsd">Send invite</button><div class="sub" id="bm"></div></div>';
 return h;
}
function vPlaybook(){
 var h='<div class="card"><h2>My patterns</h2><p class="sub">Everyone\u2019s different. Tell the app about you and it will suggest challenges to match.</p><h3>I tend to\u2026</h3><div>';
 PT.forEach(function(x){h+='<button class="chip" data-pt="'+x[0]+'" aria-pressed="'+(S.pat.t.indexOf(x[0])>-1)+'">'+x[1]+'</button>'});
 h+='</div><h3 style="margin-top:12px">The trickiest time of day</h3><div>';
 HT.forEach(function(x){h+='<button class="chip" data-ph="'+x+'" aria-pressed="'+(S.pat.h===x)+'">'+x+'</button>'});
 h+='</div><h3 style="margin-top:12px">Movement I enjoy</h3><div>';
 MV.forEach(function(x){h+='<button class="chip" data-pm="'+x+'" aria-pressed="'+(S.pat.m.indexOf(x)>-1)+'">'+x+'</button>'});

}
