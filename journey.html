<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Journey · Yoga to Transform</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF6F3;--card:#fff;--ink:#2A1F1D;--muted:#6B5558;--forest:#12452F;--cocoa:#6B3B35;--rose:#DDB8BC;--blush:#EDE0E0;--accent:#A64F5C;--line:#E8DCD9;--on-forest:#fff;
--serif:'EB Garamond',Georgia,serif;--sans:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1618;--card:#2A2022;--ink:#F3ECE6;--muted:#C2AEB1;--forest:#5FA382;--cocoa:#E8C9C4;--blush:#3A2B2D;--line:#3D2F31;--on-forest:#12201A;--accent:#E39AA6}}
:root[data-theme="dark"]{--bg:#1E1618;--card:#2A2022;--ink:#F3ECE6;--muted:#C2AEB1;--forest:#5FA382;--cocoa:#E8C9C4;--blush:#3A2B2D;--line:#3D2F31;--on-forest:#12201A;--accent:#E39AA6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans)}
.app{max-width:560px;margin:0 auto;padding:0 18px 48px}
h1,h2,h3{font-family:var(--serif);color:var(--cocoa);font-weight:600;margin:0 0 .4em;line-height:1.2}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}p{margin:0 0 .9em}
.sub{color:var(--muted);font-size:.92rem}
header{padding:22px 0 8px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;padding:10px 0;z-index:5;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:1;min-width:max-content;font:700 .9rem var(--sans);padding:10px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
nav button[aria-selected=true]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.tick{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.tick:first-of-type{border-top:0}
.tick input{width:24px;height:24px;accent-color:var(--forest);flex:none}
.tick.done span{color:var(--muted);text-decoration:line-through}
.btn{font:700 1rem var(--sans);padding:12px 22px;border-radius:999px;border:2px solid var(--forest);background:var(--forest);color:var(--on-forest);cursor:pointer;margin:4px 8px 4px 0}
.btn.o{background:transparent;color:var(--forest)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button{font:700 .9rem var(--sans);padding:8px 14px;border-radius:999px;border:1.5px solid var(--forest);background:transparent;color:var(--forest);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--forest);color:var(--on-forest)}
input[type=text],input[type=date]{width:100%;font:1rem var(--sans);padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 12px}
.msg{background:var(--blush);border-radius:14px;padding:14px 16px;margin:12px 0;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:14px 0}
.dot{aspect-ratio:1;border-radius:50%;background:var(--blush)}
.dot.d{background:var(--forest)}.dot.t{outline:2px solid var(--accent);outline-offset:1px}
.feel button{font-size:1.5rem;background:transparent;border:2px solid transparent;border-radius:12px;padding:4px 8px;cursor:pointer}
.feel button[aria-pressed=true]{border-color:var(--accent);background:var(--blush)}
.big{font-family:var(--serif);font-size:2.6rem;color:var(--cocoa);line-height:1}
.ring{display:block;margin:0 auto;max-width:240px;width:100%}
.out{border-left:4px solid var(--rose);padding:6px 14px;margin:8px 0;font-family:var(--serif);font-size:1.2rem}
.hide{display:none}
.vid{aspect-ratio:16/9;border-radius:14px;background:var(--blush);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;border:2px dashed var(--rose);color:var(--ink)}
.vid .pl{width:56px;height:56px;border-radius:50%;background:var(--forest);color:var(--on-forest);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:8px}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:700;color:var(--cocoa)}details p{margin:8px 0 0}
a.btn{display:inline-block;text-decoration:none}
.chip{font:700 .92rem var(--sans);padding:8px 14px;border-radius:999px;border:1.5px solid var(--forest);background:transparent;color:var(--forest);cursor:pointer;margin:3px 4px 3px 0}
.chip[aria-pressed=true]{background:var(--forest);color:var(--on-forest)}
.chip.x{border-style:dashed}
.log{padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}.add{display:flex;gap:8px}.add input{margin:6px 0}
</style>
</head>
<body>
<div class="app">
<header><div style="text-align:right"><a href="/">Back to my tracker</a></div><div class="sub">Yoga to Transform</div><h1>My journey</h1><p class="sub">Seventy-five days of small, kind choices. Nothing resets if you miss a day.</p></header>
<nav role="tablist" id="tabs"></nav>
<main id="main"></main>
</div>
<script>
var KEY='y2t-journey-v1',PROFILE_KEY='y2t-profile-id',TABS=[['today','Today'],['move','Move'],['timer','Meal window'],['menu','Menu'],['playbook','Playbook'],['journey','Journey']],tab='today';
var legacyMigrationAllowed=false,profileId=resolveProfileId(),CACHE={},syncReady=false,_syncTimer=null;
function resolveProfileId(){
 var valid=/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
 var url=new URL(location.href),id=url.searchParams.get('journey'),stored='';
 try{stored=localStorage.getItem(PROFILE_KEY)||''}catch(e){}
 var supplied=valid.test(id||'');legacyMigrationAllowed=!supplied||id===stored;
 if(!supplied)id=stored;
 if(!valid.test(id||''))id=crypto.randomUUID();
 try{localStorage.setItem(PROFILE_KEY,id)}catch(e){}
 if(url.searchParams.get('journey')!==id){url.searchParams.set('journey',id);history.replaceState(null,'',url.pathname+url.search+url.hash)}
 return id;
}
var ITEMS=['move my body in a way I enjoy','drink water through the day','fill my plate with real food I enjoy','eat sitting down, from a plate, slowly','read or breathe for ten quiet minutes','wind down for a good night\u2019s sleep'];
var FEEL=['\uD83D\uDE1E','\uD83D\uDE15','\uD83D\uDE42','\uD83D\uDE0A','\uD83E\uDD29'];
var S={start:null,mode:'get',days:{},fast:{start:null,hrs:12},reframes:[],menu:null,pulls:[],pat:{t:[],h:'',m:[]},worked:[],buddy:null,custom:[]};

var CATS=[['starters','Starters','Quick, a few minutes'],['mains','Mains','An hour or so'],['sides','Sides','Alongside the boring jobs'],['desserts','Desserts','Once in a while. Notice how you feel afterwards'],['specials','Specials','When they\u2019re available to you']];
var DEF={starters:['Dance to a favourite song','Have a snack','One minute of star jumps','Hug a pet'],mains:['Bake','Paint','Journal','Go for a walk','Do a jigsaw puzzle','Plan a trip'],sides:['Music while I tidy','Listen to a podcast','Light a candle','Audiobook'],desserts:['Scroll social media','Watch TV'],specials:['Book a holiday','Go to a concert','Massage or nails']};
var FEELINGS=['Tired','Stressed','Bored','Lonely','Sad','Anxious','Frustrated','Celebrating','Not sure'];
if(!S.pat)S.pat={t:[],h:'',m:[]};
var CH=['go for a 30-minute walk','do 10 minutes of strength with weights or my body','move for 10 minutes inside','swap one sugary drink for water','drink two litres of water','eat breakfast sitting down, without a screen','eat from a side plate and chew slowly','keep to a 12-hour meal window (see the timer)','add protein and veg to a meal so I feel full','plan a treat to look forward to','put a healthy meal in the freezer for later','read ten pages of a book','stretch and breathe for five minutes','wind down 30 minutes before bed','walk with a friend'];
var PT=[['fast','I eat too fast'],['bored','I snack when bored'],['skip','I skip meals, then overeat'],['tired','I eat for comfort when tired or stressed'],['evening','I graze in the evening'],['sweet','I have a sweet tooth']];
var SUG={fast:[6],bored:[9,11,12],skip:[5,8],tired:[13,12],evening:[8,9],sweet:[3,9]};
var HT=['Morning','Afternoon','Evening','Late night'],MV=['Walking','Dancing','Yoga','Strength','Swimming','Cycling'];
var PE=false,PB=-1,PICK=[],MW={w:'out',e:'mid'};
var PLAN={out:{low:'A ten-minute stroll round the block. Going counts.',mid:'An easy 20-minute walk. Pick a route you love.',full:'A brisk 30 to 45 minute walk. Add hills, or a backpack with a little weight.'},in:{low:'Five minutes of gentle stretching and slow breathing, or dance to one favourite song.',mid:'Ten minutes: 2 rounds of 10 squats, 10 wall push-ups and 30 seconds of marching on the spot.',full:'Twenty minutes: 3 rounds of 10 squats, 10 wall push-ups, 10 glute bridges and a 20-second plank. Rest when you need to.'}};
var GD=['Choose tomorrow\u2019s 3 challenges','Pack my gym bag','Put my shoes by the front door','Set an alarm for tomorrow','Pack my lunch for tomorrow','Lay out my yoga gear','Put overnight oats or chia in the fridge','Fill a water bottle'],GE=false;
if(!S.gifts)S.gifts=GD.slice();
if(!S.menu)S.menu=JSON.parse(JSON.stringify(DEF));
var PF='',NOTE='',EDIT=false,MSG='';
function scheduleSync(){
 clearTimeout(_syncTimer);
 _syncTimer=setTimeout(async function(){
  try{await fetch('/api/state?journey='+encodeURIComponent(profileId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(CACHE)})}catch(e){}
 },600);
}
function save(){if(!syncReady)return;CACHE.y2t=S;scheduleSync()}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ds(new Date())}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function day(k){return S.days[k]||(S.days[k]={c:[],f:0})}
function dayNum(){if(!S.start)return 0;var a=new Date(S.start+'T00:00'),b=new Date(today()+'T00:00');return Math.round((b-a)/864e5)+1}
function counted(k){var d=S.days[k];return d&&d.p&&d.p.length&&d.c.length>=2}
function pre(){return S.mode==='get'?'I get to ':'I want to '}
function render(){
 var t=document.getElementById('tabs');
 t.innerHTML=TABS.map(function(x){return '<button role="tab" data-t="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+'</button>'}).join('');
 t.querySelectorAll('button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
 var m=document.getElementById('main');
 m.innerHTML=({today:vToday,timer:vTimer,menu:vMenu,move:vMove,playbook:vPlaybook,journey:vJourney})[tab]();
 bind();
}
function glowViews(){
 var by={},days=[],h='',all=0;
 for(var i=13;i>=0;i--){var dd=new Date();dd.setDate(dd.getDate()-i);var d=S.days[ds(dd)],v=[];
  if(d&&d.ac)Object.keys(d.ac).forEach(function(j){var r=d.ac[j];if(r){v.push(r);var t=(d.p||[])[j];if(t){(by[t]=by[t]||[]).push(r)}all++}});
  days.push(v.length?v.reduce(function(a,b){return a+b},0)/v.length:0)}
 var tot=0;Object.keys(S.days).forEach(function(k){var d=S.days[k];if(d.ac)tot+=Object.keys(d.ac).length});
 if(days.filter(Boolean).length>=3){
  h+='<h3 style="margin-top:16px">Afterglow, last 14 days</h3><svg viewBox="0 0 140 44" width="100%" role="img" aria-label="Afterglow over the last 14 days">';
  days.forEach(function(v,i){h+='<rect x="'+(i*10)+'" y="'+(40-(v?v/5*36:2))+'" width="8" height="'+(v?v/5*36:2)+'" rx="2" fill="'+(v?'var(--forest)':'var(--blush)')+'"/>'});
  h+='</svg><p class="sub">Taller bars mean you felt better afterwards.</p>';
 }
 var top=Object.keys(by).map(function(t){return[t,by[t].reduce(function(a,b){return a+b},0)/by[t].length,by[t].length]}).filter(function(x){return x[2]>=2}).sort(function(a,b){return b[1]-a[1]}).slice(0,3);
 if(tot>=3&&top.length){h+='<h3 style="margin-top:12px">What leaves me feeling best</h3>';top.forEach(function(x){h+='<div class="out">'+esc(x[0])+' <span class="sub">'+x[1].toFixed(1)+' out of 5</span></div>'})}
 return h;
}
function welcome(){
 if(!S.start)return'';var last=null;
 Object.keys(S.days).forEach(function(k){var d=S.days[k];if(d.c&&d.c.length&&(!last||k>last))last=k});
 if(!last)return'';
 var gap=Math.round((new Date(today()+'T00:00')-new Date(last+'T00:00'))/864e5);
 if(gap<3)return'';
 var h='<div class="card"><h3>Welcome back</h3><p>Nothing has reset. Pick up today. '+(S.worked.length?'Here\u2019s what worked for you before:':'Tip: jot down what works for you in your playbook.')+'</p>';
 S.worked.slice(0,3).forEach(function(x){h+='<div class="out">'+esc(x)+'</div>'});
 return h+'<button class="btn o" data-go="playbook">Open my playbook</button></div>';
}
function yest(){var d=new Date();d.setDate(d.getDate()-1);return ds(d)}
function thanks(){var y=S.days[yest()];if(!y||!y.g||!y.g.length)return'';
 return '<div class="card"><h3>Thanks, past you</h3><p class="sub">Last night you left yourself a few gifts:</p>'+y.g.map(function(x){return '<div class="out">'+esc(x)+'</div>'}).join('')+'</div>'}
function giftCard(){
 if(new Date().getHours()<16)return'';
 var d=day(today());d.g=d.g||[];
 var h='<div class="card"><h3>Leave a gift for tomorrow</h3><p class="sub">Small things tonight make tomorrow easier. These are optional and don\u2019t count toward your 3.</p>';
 if(GE){S.gifts.forEach(function(x,i){h+='<button class="chip x" data-gx="'+i+'">'+esc(x)+' \u00D7</button>'});
  h+='<div class="add"><input type="text" id="ga" maxlength="60" placeholder="Add my own gift" aria-label="Add my own gift"><button class="chip" id="gab">Add</button></div>'}
 else S.gifts.forEach(function(x,i){var on=d.g.indexOf(x)>-1;h+='<label class="tick'+(on?' done':'')+'"><input type="checkbox" data-gi="'+i+'"'+(on?' checked':'')+'><span>'+esc(x)+'</span></label>'});
 if(!GE&&d.g.length)h+='<div class="msg">Lovely. Tomorrow-you says thanks.</div>';
 return h+'<button class="chip x" id="gedit">'+(GE?'Done editing':'Edit my gifts')+'</button></div>';
}
function suggested(){var o=[];S.pat.t.forEach(function(t){(SUG[t]||[]).forEach(function(i){if(o.indexOf(i)<0)o.push(i)})});return o}
function vToday(){
 var k=today(),d=day(k),n=dayNum(),h='';
 if(!S.start)h+='<div class="card"><h2>Ready when you are</h2><p class="sub">Pick the day you\u2019d like to begin. Today works.</p><input type="date" id="sd" value="'+today()+'"><button class="btn" id="go">Begin my 75 days</button></div>';
 else h+='<div class="card"><div class="sub">Your journey</div><div class="big">Day '+Math.min(n,75)+'<span class="sub"> of 75</span></div></div>';
 h+=thanks()+welcome();
 if(!S.pat.t.length&&!S.pat.h)h+='<div class="card"><h3>Let\u2019s get to know you</h3><p class="sub">A couple of minutes to set things up around your own patterns.</p><button class="btn o" data-go="playbook">Tell me about me</button></div>';
 h+='<div class="card"><div class="row" style="justify-content:space-between"><h2>Today\u2019s 3 challenges</h2><div class="seg"><button data-m="get" aria-pressed="'+(S.mode==='get')+'">I get to</button> <button data-m="want" aria-pressed="'+(S.mode==='want')+'">I want to</button></div></div>';
 if(!d.p||!d.p.length){
  var sg=suggested(),all=CH.concat(S.custom);
  h+='<p class="sub">Choose three to try today. Try something new, repeat a favourite, or change them tomorrow. Nothing here is forever.'+(sg.length?' \u2605 = suggested for you.':'')+'</p><div>';
  all.forEach(function(c,i){h+='<button class="chip" data-p="'+i+'" aria-pressed="'+(PICK.indexOf(c)>-1)+'">'+(sg.indexOf(i)>-1?'\u2605 ':'')+esc(c)+'</button>'});
  h+='</div><div class="add"><input type="text" id="cu" maxlength="60" placeholder="Add my own challenge" aria-label="Add my own challenge"><button class="chip" id="cub">Add</button></div><div class="sub">'+PICK.length+' of 3 chosen</div><button class="btn" id="st"'+(PICK.length===3?'':' disabled style="opacity:.45"')+'>Start today\u2019s challenges</button>';
 }else{
  d.p.forEach(function(it,i){var on=d.c.indexOf(i)>-1;h+='<label class="tick'+(on?' done':'')+'"><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+'><span>'+pre()+esc(it)+'</span></label>';
   if(on){var ac=(d.ac||{})[i];h+='<div style="padding-left:36px"><div class="sub">How did that feel?</div><div class="feel">'+FEEL.map(function(f,r){return '<button data-ac="'+i+'-'+(r+1)+'" aria-pressed="'+(ac===r+1)+'" aria-label="Afterglow '+(r+1)+' of 5">'+f+'</button>'}).join('')+'</div>';
    if(PB===i)h+='<div class="msg">That felt good. Add it to your playbook so you remember?<br><button class="chip" data-pbadd="'+i+'">Add to playbook</button><button class="chip x" data-pbx="1">Not now</button></div>';
    h+='</div>'}});
  var c=d.c.length;
  h+='<div class="msg">'+(c>=2?'That\u2019s today counted. Anything else is a bonus.':c===1?'One down. Two counts as a full day.':'Start with whichever feels easiest.')+'</div><button class="chip x" id="ch">Change my picks</button>';
 }
 h+='</div>';
 if(S.buddy)h+='<div class="card"><h3>Walk with '+esc(S.buddy.n||'my buddy')+'</h3><p>'+esc(S.buddy.w)+'</p>'+(S.buddy.solo?'<p class="sub">If they can\u2019t make it, I\u2019m going anyway.</p>':'')+'</div>';
 h+=giftCard();
 h+='<div class="card"><h3>How do I feel today?</h3><div class="feel">'+FEEL.map(function(f,i){return '<button data-f="'+(i+1)+'" aria-pressed="'+(d.f===i+1)+'" aria-label="Feeling '+(i+1)+' of 5">'+f+'</button>'}).join('')+'</div></div>';
 h+='<div class="card"><h3>Feeling a pull toward food?</h3><p class="sub">'+(S.pat.h?'Your tricky time is '+S.pat.h.toLowerCase()+'. Have a starter ready. ':'')+'Pause for a moment and check your menu.</p><button class="btn o" data-go="menu">Open my menu</button></div>';
 return h;
}
function vMove(){
 var h='<div class="card"><h2>Move my way</h2><p class="sub">'+(S.pat.m.length?'You enjoy '+S.pat.m.join(', ').toLowerCase()+'. ':'')+'Pick where you are and how much energy you\u2019ve got. There\u2019s always a version that counts.</p><h3>Where?</h3><div class="seg row"><button data-w="out" aria-pressed="'+(MW.w==='out')+'">Outside</button><button data-w="in" aria-pressed="'+(MW.w==='in')+'">Inside (rain or no time)</button></div><h3 style="margin-top:14px">Energy?</h3><div class="seg row"><button data-e="low" aria-pressed="'+(MW.e==='low')+'">Low</button><button data-e="mid" aria-pressed="'+(MW.e==='mid')+'">Okay</button><button data-e="full" aria-pressed="'+(MW.e==='full')+'">Full</button></div><div class="msg">'+PLAN[MW.w][MW.e]+'</div><p class="sub">Discomfort is okay. Pain is information. Stop if something is sharp or you feel dizzy.</p></div>';
 var b=S.buddy||{n:'',w:'',solo:true};
 h+='<div class="card"><h2>Walking buddy</h2><p class="sub">Plans with another person are easier to keep. Decide now what happens if they cancel.</p><label class="sub" for="bn">Who?</label><input type="text" id="bn" maxlength="40" value="'+esc(b.n)+'" placeholder="A friend, Mum, a neighbour"><label class="sub" for="bw">When and where?</label><input type="text" id="bw" maxlength="80" value="'+esc(b.w)+'" placeholder="Saturday 8am, lake loop"><label class="tick"><input type="checkbox" id="bs"'+(b.solo?' checked':'')+'><span>If they can\u2019t make it, I\u2019ll go anyway</span></label><button class="btn" id="bsv">Save plan</button><button class="btn o" id="bsd">Send invite</button><div class="sub" id="bm"></div></div>';
 return h;
}
function vPlaybook(){
 var h='<div class="card"><h2>My patterns</h2><p class="sub">Everyone\u2019s different. Tell the app about you and it will suggest challenges to match.</p><h3>I tend to\u2026</h3><div>';
 PT.forEach(function(x){h+='<button class="chip" data-pt="'+x[0]+'" aria-pressed="'+(S.pat.t.indexOf(x[0])>-1)+'">'+x[1]+'</button>'});
 h+='</div><h3 style="margin-top:12px">The trickiest time of day</h3><div>';
 HT.forEach(function(x){h+='<button class="chip" data-ph="'+x+'" aria-pressed="'+(S.pat.h===x)+'">'+x+'</button>'});
 h+='</div><h3 style="margin-top:12px">Movement I enjoy</h3><div>';
 MV.forEach(function(x){h+='<button class="chip" data-pm="'+x+'" aria-pressed="'+(S.pat.m.indexOf(x)>-1)+'">'+x+'</button>'});
 h+='</div></div><div class="card"><h2>What worked last time</h2><p class="sub">Write it down now so you can find it when you need to start again.</p><input type="text" id="wk" maxlength="140" placeholder="e.g. Celery and egg lunch kept me full" aria-label="What worked"><button class="btn" id="wks">Add to my playbook</button>';
 S.worked.forEach(function(x,i){h+='<div class="out">'+esc(x)+(PE?' <button class="chip x" data-wd="'+i+'" aria-label="Delete note">Delete</button>':'')+'</div>'});
 if(S.worked.length||S.reframes.length)h+='<button class="chip x" id="wed">'+(PE?'Done editing':'Edit or delete notes')+'</button>';
 return h+'</div>'+vReframe();
}
var MEALVIDEO=''; /* TODO: Add the approved video link when ready. Keep blank until confirmed. */
function mealExtras(){
 var h='<div class="card"><h3>Watch: how to use your meal window</h3>';
 h+=MEALVIDEO?'<a class="btn" href="'+MEALVIDEO+'" target="_blank" rel="noopener">Watch the video</a>':'<div class="vid"><div class="pl">\u25B6</div><b>Video coming soon</b><span class="sub">A short walk-through from Kristina and Audrie</span></div>';
 h+='</div><div class="card"><h3>Making it work</h3>';
 [['What this is','A gentle rest between your last meal and your first, mostly while you sleep. For example, finish dinner at 7pm and have breakfast at 7am. It isn\u2019t about eating less overall. It\u2019s a way to notice hunger and enjoy your meals more.'],
 ['Start gently','Begin with 12 hours. Add an hour only if you feel good. There\u2019s no prize for going longer.'],
 ['When your window opens','Sit down and serve your plate. Include some protein and fibre so you feel full, and eat slowly. Notice how the first meal tastes.'],
 ['When hunger shows up','Hunger comes in waves and often passes. Try water or herbal tea first. If you\u2019re really hungry, lightheaded or shaky, eat. Listening to your body is the point.'],
 ['Keep it light','Treat it as a fun challenge, not a test. Missed it today? Try again tomorrow. Nothing resets.'],
 ['Signs to stop or change it','Feeling tired, irritable or anxious about food, sleeping badly, or eating a lot more later. Shorten the window or stop, and talk to Kristina or Audrie.']
 ].forEach(function(x){h+='<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'});
 return h+'</div>';
}
function vTimer(){
 var f=S.fast,h='<div class="card"><h2>Meal window timer</h2><p class="sub">A gentle overnight rest between your last meal and your first. A way to notice hunger and enjoy each meal more, not a race.</p><div class="seg row">';
 [12,13,14].forEach(function(x){h+='<button data-h="'+x+'" aria-pressed="'+(f.hrs===x)+'">'+x+' hours</button>'});
 h+='</div>';
 h+='<svg class="ring" viewBox="0 0 200 200" role="img" aria-label="Timer progress"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--blush)" stroke-width="14"/><circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="var(--forest)" stroke-width="14" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="540.4" stroke-dashoffset="540.4"/><text id="tt" x="100" y="108" text-anchor="middle" font-family="EB Garamond,Georgia,serif" font-size="34" fill="var(--cocoa)">0:00:00</text></svg>';
 h+='<div class="msg" id="ph"></div><div class="row">'+(f.start?'<button class="btn" id="fe">My window is open, time to eat</button><button class="btn o" id="fp">Stop timer</button>':'<button class="btn" id="fs">I\u2019ve finished eating, start timer</button>')+'</div>';
 h+='</div>'+mealExtras()+'<div class="card"><h3>Before you eat</h3><p>Pause. Take three slow breaths. Serve your plate first, then sit down and chew slowly. Notice how it tastes.</p></div>';
 h+='<p class="sub">Not for everyone. Skip it if you\u2019re pregnant or breastfeeding, have diabetes, take medication that needs food, or have a history of disordered eating. Check with your GP if unsure. Feeling dizzy, unwell or anxious about food? Stop and eat. This app isn\u2019t medical advice.</p>';
 h+=helpCard();
 return h;
}
var CONTACT='https://www.yogatotransform.com/contact-us';

function helpCard(){
 var h='<div class="card"><h3>Want a hand? Ask Kristina or Audrie</h3><p class="sub">If a pattern keeps showing up or today feels heavy, you don\u2019t have to work it out alone. Reach out, or book a time to talk it through.</p>';
 TEAM.forEach(function(t){
  var m=t.email?'mailto:'+t.email+'?subject='+encodeURIComponent('A hand with my journey')+'&body='+encodeURIComponent('Hi '+t.n+',\n\nI\u2019d love some support with...'):CONTACT;
  h+='<div class="row" style="margin:6px 0"><a class="btn" href="'+m+'" target="_blank" rel="noopener">Message '+t.n+'</a><a class="btn o" href="'+(t.meet||CONTACT)+'" target="_blank" rel="noopener">Book a chat with '+t.n+'</a></div>';
 });

}
function vMenu(){
 var h='<div class="card"><h2>When I feel the pull</h2><p class="sub">Reaching for food when we\u2019re feeling something is human. Noticing it is the skill. No guilt needed: notice, choose, and learn. Each time you spot an old pattern, you get another chance to choose differently.</p><h3>What am I feeling?</h3><div>';
 FEELINGS.forEach(function(f){h+='<button class="chip" data-pf="'+f+'" aria-pressed="'+(PF===f)+'">'+f+'</button>'});
 h+='</div><label class="sub" for="pn" style="display:block;margin-top:12px">What did I notice, or what might I try next time? (optional)</label><input type="text" id="pn" maxlength="140" value="'+esc(NOTE)+'"></div>';
 if(MSG)h+='<div class="msg">'+MSG+'</div>';
 CATS.forEach(function(c){
  h+='<div class="card"><h3>'+c[1]+'</h3><p class="sub">'+c[2]+'</p><div>';
  S.menu[c[0]].forEach(function(it,j){h+='<button class="chip'+(EDIT?' x':'')+'" data-c="'+c[0]+'" data-j="'+j+'">'+esc(it)+(EDIT?' \u00D7':'')+'</button>'});
  h+='</div><div class="add"><input type="text" data-add="'+c[0]+'" placeholder="Add your own" maxlength="50" aria-label="Add to '+c[1]+'"><button class="chip" data-addb="'+c[0]+'">Add</button></div></div>';
 });
 h+='<div class="card"><p>Ate for comfort anyway? That\u2019s okay. Logging it is how you spot the pattern.</p><button class="btn o" id="ate">I ate for comfort, and that\u2019s okay</button> <button class="btn o" id="ed">'+(EDIT?'Done editing menu':'Edit my menu')+'</button></div>';
 h+=helpCard();
 var P=S.pulls;
 if(P.length){
  var ch=P.filter(function(x){return x.ty==='chose'}).length,cnt={};P.forEach(function(x){cnt[x.f]=(cnt[x.f]||0)+1});
  var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0];
  h+='<div class="card"><h3>What I\u2019m noticing</h3><p class="sub">'+P.length+' moments noticed. '+ch+' times I chose something from my menu.'+(P.length>=3?' Most common feeling: '+esc(top.toLowerCase())+'.':'')+'</p>';
  P.slice(0,5).forEach(function(x){h+='<div class="log"><b>'+esc(x.f)+'</b> \u2192 '+(x.ty==='chose'?'chose: '+esc(x.c):'ate for comfort, and noticed it')+(x.n?'<br><span class="sub">'+esc(x.n)+'</span>':'')+'</div>'});
  h+='</div>';
 }
 return h;
}
function logPull(ty,c){S.pulls.unshift({d:today(),f:PF||'Not sure',ty:ty,c:c||'',n:NOTE});S.pulls=S.pulls.slice(0,60);
 MSG=ty==='chose'?'Nice choosing. You\u2019re building a new pattern.':'Thanks for noticing. That\u2019s the skill, not a failure. What might you try next time?';
 PF='';NOTE='';save();render()}
function vReframe(){
 var h='<div class="card"><h2>From \u201CI should\u201D to \u201CI get to\u201D</h2><p class="sub">\u201CShould\u201D carries pressure and guilt. \u201CGet to\u201D and \u201Cwant to\u201D point at what you\u2019re choosing and why.</p>';
 h+='<label class="sub" for="r1">Something I feel I should do</label><input type="text" id="r1" placeholder="go for a walk" maxlength="80"><label class="sub" for="r2">Why it matters to me</label><input type="text" id="r2" placeholder="it clears my head" maxlength="100">';
 h+='<div id="ro"></div><button class="btn" id="rs">Save my reframe</button></div>';
 if(S.reframes.length){h+='<h3>My reframes</h3>';S.reframes.slice(0,8).forEach(function(x,i){h+='<div class="out">'+esc(x)+(PE?' <button class="chip x" data-rd="'+i+'" aria-label="Delete reframe">Delete</button>':'')+'</div>'})}
 return h;
}
function vJourney(){
 var n=dayNum(),h='<div class="card"><h2>75-day view</h2><p class="sub">Anyone with your private link can see and update your journey. Keep it private.</p><input type="text" id="private-link" readonly value="'+esc(location.origin+location.pathname+'?journey='+profileId)+'" aria-label="Your private Journey link"><button class="btn o" id="copy-link">Copy my private link</button><p class="sub" id="copy-status" aria-live="polite"></p>';
 if(!S.start)return h+'<p class="sub">Begin your journey on the Today tab and your days will appear here.</p></div>';
 var tot=0,g='';
 for(var i=0;i<75;i++){var d=new Date(S.start+'T00:00');d.setDate(d.getDate()+i);var k=ds(d),c=counted(k);if(c)tot++;g+='<div class="dot'+(c?' d':'')+(i+1===n?' t':'')+'" title="Day '+(i+1)+'"></div>'}
 h+='<p class="sub">Filled circle = a day that counted. Empty circles are just days, not failures.</p><div class="grid">'+g+'</div>';
 var tr={},ga=[];Object.keys(S.days).forEach(function(k){var d=S.days[k];(d.p||[]).forEach(function(x,i){if(d.c.indexOf(i)>-1)tr[x]=1;if(d.ac&&d.ac[i])ga.push(d.ac[i])})});
 h+='<div class="row" style="gap:28px"><div><div class="big">'+tot+'</div><div class="sub">days counted</div></div><div><div class="big">'+Object.keys(tr).length+'</div><div class="sub">different challenges tried</div></div>'+(ga.length>=3?'<div><div class="big">'+(ga.reduce(function(a,b){return a+b},0)/ga.length).toFixed(1)+'</div><div class="sub">average afterglow (out of 5)</div></div>':'')+'</div>';
 h+=glowViews()+'<div class="msg">'+(n>1&&tot<n-1?'Missed a few days? Nothing resets. Pick up today.':'You\u2019re building something steady.')+'</div>';
 h+='<button class="btn o" id="rst">Start over with a new date</button></div>';
 return h;
}
function bind(){
var q=function(s){return document.querySelector(s)},qa=function(s){return document.querySelectorAll(s)};
 var copyLink=q('#copy-link');if(copyLink)copyLink.onclick=async function(){var input=q('#private-link'),status=q('#copy-status');try{await navigator.clipboard.writeText(input.value);status.textContent='Private link copied.'}catch(e){input.focus();input.select();status.textContent='Select and copy your private link.'}};
 var go=q('#go');if(go)go.onclick=function(){S.start=q('#sd').value||today();save();render()};
 qa('[data-m]').forEach(function(b){b.onclick=function(){S.mode=b.dataset.m;save();render()}});
 qa('[data-i]').forEach(function(b){b.onchange=function(){var d=day(today()),i=+b.dataset.i,p=d.c.indexOf(i);if(p>-1){d.c.splice(p,1);if(d.ac)delete d.ac[i]}else d.c.push(i);PB=-1;save();render()}});
 qa('[data-f]').forEach(function(b){b.onclick=function(){var d=day(today());d.f=d.f===+b.dataset.f?0:+b.dataset.f;save();render()}});
 qa('[data-h]').forEach(function(b){b.onclick=function(){S.fast.hrs=+b.dataset.h;save();render()}});
 var fs=q('#fs');if(fs)fs.onclick=function(){S.fast.start=Date.now();save();render()};
 var fe=q('#fe');if(fe)fe.onclick=function(){S.fast.start=null;save();render()};
 var fp=q('#fp');if(fp)fp.onclick=function(){S.fast.start=null;save();render()};
 var r1=q('#r1');
 if(r1){var up=function(){var a=r1.value.trim(),b=q('#r2').value.trim();q('#ro').innerHTML=a?'<div class="out">I get to '+esc(a)+'.</div><div class="out">I want to '+esc(a)+(b?', because '+esc(b):'')+'.</div>':''};r1.oninput=up;q('#r2').oninput=up;
  q('#rs').onclick=function(){var a=r1.value.trim(),b=q('#r2').value.trim();if(!a)return;S.reframes.unshift('I want to '+a+(b?', because '+b:'')+'.');save();render()}}
 var rst=q('#rst');if(rst)rst.onclick=function(){if(confirm('Pick a new start date? Your ticks are kept.')){S.start=null;save();tab='today';render()}};
 qa('[data-go]').forEach(function(b){b.onclick=function(){tab=b.dataset.go;render();window.scrollTo(0,0)}});
 qa('[data-pf]').forEach(function(b){b.onclick=function(){PF=PF===b.dataset.pf?'':b.dataset.pf;MSG='';render()}});
 var pn=q('#pn');if(pn)pn.oninput=function(){NOTE=pn.value};
 qa('[data-c]').forEach(function(b){b.onclick=function(){var c=b.dataset.c,j=+b.dataset.j;if(EDIT){S.menu[c].splice(j,1);save();render()}else logPull('chose',S.menu[c][j])}});
 qa('[data-addb]').forEach(function(b){b.onclick=function(){var c=b.dataset.addb,i=q('[data-add="'+c+'"]'),v=i.value.trim();if(v){S.menu[c].push(v);save();render()}}});
 var at=q('#ate');if(at)at.onclick=function(){logPull('ate','')};
 var ed=q('#ed');if(ed)ed.onclick=function(){EDIT=!EDIT;render()};
 qa('[data-p]').forEach(function(b){b.onclick=function(){var c=CH.concat(S.custom)[+b.dataset.p],i=PICK.indexOf(c);if(i>-1)PICK.splice(i,1);else if(PICK.length<3)PICK.push(c);render()}});
 var st=q('#st');if(st)st.onclick=function(){if(PICK.length===3){var d=day(today());d.p=PICK.slice();d.c=[];PICK=[];save();render()}};
 var chb=q('#ch');if(chb)chb.onclick=function(){var d=day(today());PICK=d.p.slice();d.p=[];d.c=[];save();render()};
 var cub=q('#cub');if(cub)cub.onclick=function(){var v=q('#cu').value.trim();if(v){S.custom.push(v);save();render()}};
 qa('[data-a]').forEach(function(b){b.onclick=function(){var d=day(today());d.a=d.a===+b.dataset.a?0:+b.dataset.a;save();render()}});
 qa('[data-w]').forEach(function(b){b.onclick=function(){MW.w=b.dataset.w;render()}});
 qa('[data-e]').forEach(function(b){b.onclick=function(){MW.e=b.dataset.e;render()}});
 function tg(a,v){var i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);save();render()}
 qa('[data-pt]').forEach(function(b){b.onclick=function(){tg(S.pat.t,b.dataset.pt)}});
 qa('[data-pm]').forEach(function(b){b.onclick=function(){tg(S.pat.m,b.dataset.pm)}});
 qa('[data-ph]').forEach(function(b){b.onclick=function(){S.pat.h=S.pat.h===b.dataset.ph?'':b.dataset.ph;save();render()}});
 var wks=q('#wks');if(wks)wks.onclick=function(){var v=q('#wk').value.trim();if(v){S.worked.unshift(v);save();render()}};
 var bsv=q('#bsv');
 if(bsv){var rd=function(){return{n:q('#bn').value.trim(),w:q('#bw').value.trim(),solo:q('#bs').checked}};
  bsv.onclick=function(){var b=rd();if(!b.w){q('#bm').textContent='Add when and where first.';return}S.buddy=b;save();q('#bm').textContent='Saved. It will show on your Today tab.'};
  q('#bsd').onclick=function(){var b=rd(),t='Fancy a walk'+(b.w?' \u2013 '+b.w:'')+'? No pressure if you can\u2019t make it.';
   if(navigator.share){navigator.share({text:t}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){q('#bm').textContent='Invite copied. Paste it into a message.'},function(){q('#bm').textContent=t})}else q('#bm').textContent=t}}
 qa('[data-gi]').forEach(function(b){b.onchange=function(){var d=day(today()),x=S.gifts[+b.dataset.gi],i=(d.g=d.g||[]).indexOf(x);i>-1?d.g.splice(i,1):d.g.push(x);save();render()}});
 qa('[data-gx]').forEach(function(b){b.onclick=function(){S.gifts.splice(+b.dataset.gx,1);save();render()}});
 var gab=q('#gab');if(gab)gab.onclick=function(){var v=q('#ga').value.trim();if(v){S.gifts.push(v);save();render()}};
 var ged=q('#gedit');if(ged)ged.onclick=function(){GE=!GE;render()};
 qa('[data-ac]').forEach(function(b){b.onclick=function(){var a=b.dataset.ac.split('-'),i=+a[0],r=+a[1],d=day(today());d.ac=d.ac||{};if(d.ac[i]===r){delete d.ac[i];PB=-1}else{d.ac[i]=r;PB=r>=4?i:-1}save();render()}});
 qa('[data-pbadd]').forEach(function(b){b.onclick=function(){var d=day(today()),t=d.p[+b.dataset.pbadd];S.worked.unshift('I felt good after: '+t);PB=-1;save();render()}});
 qa('[data-pbx]').forEach(function(b){b.onclick=function(){PB=-1;render()}});
 qa('[data-wd]').forEach(function(b){b.onclick=function(){S.worked.splice(+b.dataset.wd,1);save();render()}});
 qa('[data-rd]').forEach(function(b){b.onclick=function(){S.reframes.splice(+b.dataset.rd,1);save();render()}});
 var wed=q('#wed');if(wed)wed.onclick=function(){PE=!PE;render()};
 tick();
}
var TM;function tick(){
 clearTimeout(TM);var arc=document.getElementById('arc');if(!arc)return;
 var f=S.fast,tt=document.getElementById('tt'),ph=document.getElementById('ph');
 if(!f.start){tt.textContent='0:00:00';ph.textContent='When you\u2019ve finished eating for the day, start the timer. Stop it any time you need to.';return}
 var s=Math.floor((Date.now()-f.start)/1000),hrs=s/3600;
 tt.textContent=Math.floor(hrs)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 arc.setAttribute('stroke-dashoffset',540.4*(1-Math.min(1,hrs/f.hrs)));
 ph.textContent=hrs>=f.hrs?'Your window is open. Eat slowly, from a plate, and notice how it tastes.':hrs<4?'Settling after your last meal.':hrs<8?'Resting and digesting. Water or herbal tea is fine.':'Hunger comes in waves and passes. Notice it without judging it. Eat if you need to.';
 TM=setTimeout(function(){if(tab==='timer')tick()},1000);
}
async function bootJourney(){
 try{var response=await fetch('/api/state?journey='+encodeURIComponent(profileId));CACHE=response.ok?(await response.json()||{}):{}}catch(e){CACHE={}}
 var migrated=false;
 if(CACHE.y2t)S=Object.assign(S,CACHE.y2t);
 else if(legacyMigrationAllowed){try{var legacy=localStorage.getItem(KEY);if(legacy){S=Object.assign(S,JSON.parse(legacy));CACHE.y2t=S;migrated=true}}catch(e){}}
 if(!S.pat)S.pat={t:[],h:'',m:[]};
 if(!S.gifts)S.gifts=GD.slice();
 if(!S.menu)S.menu=JSON.parse(JSON.stringify(DEF));
 syncReady=true;render();
 if(migrated)save();
}
bootJourney();
